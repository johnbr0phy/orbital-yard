  /* each species has its own size band — a shoal is fry and whales, never
     a parade of sister frigates */
  const SZ=[[20,60],[30,75],[18,52],[20,60],[8,20],[12,30],[10,30],[16,45]][arch];

function livingFoes(side){
  const o=[];
  for(const t of ships)if(t.side!==side&&!t.dead&&t.vao)o.push(t);
  return o;
}
function centroidOf(mem){
  let x=0,y=0,z=0,n=0;
  for(const id of mem){const s=ships[id];if(s.dead)continue;x+=s.x;y+=s.y;z+=s.z;n++;}
  return n?[x/n,y/n,z/n]:null;
}
function fleetCentroid(side){
  let x=0,y=0,z=0,n=0;
  for(const t of ships)if(t.side===side&&!t.dead&&t.vao){x+=t.x;y+=t.y;z+=t.z;n++;}
  return n?[x/n,y/n,z/n]:[0,0,0];

function assignTactic(sq,now){
  sq.mem=sq.mem.filter(id=>!ships[id].dead);
  if(!sq.mem.length)return;
  const foes=foeCache[1-sq.side].length?foeCache[1-sq.side]:livingFoes(sq.side);
  if(!foes.length)return;
  const c=centroidOf(sq.mem)||[0,0,0];
  const ec=fleetCentroid(1-sq.side);
  /* the approach is not the melee: nobody feigns weakness or picks over
     the wounded before the fleets have even met — early hands are dealt
     from the advancing half of the deck only */
  const gap=Math.hypot(c[0]-ec[0],c[1]-ec[1],c[2]-ec[2]);
  const deck=gap>640?DOCTRINE.filter(d2=>d2.n!=="FEIGN"&&d2.n!=="SWARM"):DOCTRINE;
  let tot=0;for(const d of deck)tot+=d.w[sq.side];

  for(const d of deck){r-=d.w[sq.side];if(r<=0){pick=d;break;}}
  sq.tac=pick.n;sq.until=now+9+Math.random()*7;sq.wp=null;sq.tgt=-1;sq.phase=1;sq.guard=-1;
  const nearestTo=p=>{
    let b=-1,bd=1e18;
    for(const t of foes){
      const d=(t.x-p[0])*(t.x-p[0])+(t.y-p[1])*(t.y-p[1])+(t.z-p[2])*(t.z-p[2]);
      if(d<bd){bd=d;b=t.id;}}
    return b;};
  if(pick.n==="CHARGE")sq.tgt=nearestTo(c);
  else if(pick.n==="SWARM"){
    let b=-1,bs=1e9;
    for(const t of foes){
      const k2=t.hp/t.hpMax*2+Math.hypot(t.x-c[0],t.y-c[1],t.z-c[2])/1400;
      if(k2<bs){bs=k2;b=t.id;}}
    sq.tgt=b;
  }else if(pick.n==="HUNT"){
    const crowns=foes.filter(t=>t.hulls);
    sq.tgt=crowns.length?crowns[(Math.random()*crowns.length)|0].id:nearestTo(c);
  }else if(pick.n==="FLANK"){
    const sg=Math.random()<0.5?1:-1;
    sq.wp=[ec[0],ec[1]+(Math.random()-0.5)*120,ec[2]+sg*(430+Math.random()*260)];
    sq.phase=0;
  }else if(pick.n==="ENVELOP"){
    const sg=Math.random()<0.5?1:-1;
    sq.wp=[ec[0],ec[1]+sg*(300+Math.random()*160),ec[2]+(Math.random()-0.5)*220];
    sq.phase=0;
  }else if(pick.n==="SCREEN"){
    const crowns=[];
    for(const t of ships)if(t.side===sq.side&&t.hulls&&!t.dead)crowns.push(t);
    if(crowns.length){sq.guard=crowns[(Math.random()*crowns.length)|0].id;sq.phase=2;}
    else sq.tgt=nearestTo(c);
  }else if(pick.n==="MINE"){
    /* seed the water between the fleets — "hold out baits" */
    sq.wp=[(c[0]+ec[0])/2+(Math.random()-0.5)*200,
           (c[1]+ec[1])/2+(Math.random()-0.5)*120,
           (c[2]+ec[2])/2+(Math.random()-0.5)*520];
    sq.phase=4;
  }else{ /* FEIGN */
    const away=V.norm([c[0]-ec[0],0,c[2]-ec[2]]);
    sq.wp=[c[0]+away[0]*500,c[1],c[2]+away[2]*500];
    sq.phase=3;sq.until=now+4.5+Math.random()*3;
  }
}
function squadThink(now){
  for(const sq of squads){
    sq.mem=sq.mem.filter(id=>!ships[id].dead);
    if(!sq.mem.length)continue;
    if((now>sq.until||(sq.phase===1&&(sq.tgt<0||ships[sq.tgt].dead)))&&now>(sq.lock||0)){
      sq.lock=now+0.4;                /* no re-dealing every tick of a massacre */
      assignTactic(sq,now);continue;
    }
    if(sq.phase===0&&sq.wp){
      const c=centroidOf(sq.mem);
      if(c&&Math.hypot(c[0]-sq.wp[0],c[1]-sq.wp[1],c[2]-sq.wp[2])<130){
        /* on station: fall on whatever is nearest the ambush point */
        sq.phase=1;
        let b=-1,bd=1e18;
        for(const t of foeCache[1-sq.side]){
          const d=(t.x-sq.wp[0])*(t.x-sq.wp[0])+(t.y-sq.wp[1])*(t.y-sq.wp[1])+(t.z-sq.wp[2])*(t.z-sq.wp[2]);
          if(d<bd){bd=d;b=t.id;}}

    }

  }

function nearestFoeInRange(s,rng){
  let b=null,bd=rng*rng;
  const arr=foeCache[1-s.side];
  for(let i=0;i<arr.length;i++){
    const t=arr[i];
    const d=(t.x-s.x)*(t.x-s.x)+(t.y-s.y)*(t.y-s.y)+(t.z-s.z)*(t.z-s.z);
    if(d<bd){bd=d;b=t;}

}

function boom(t,now){

            t.z+(Math.random()-0.5)*spread,now+t0a+Math.random()*(t0b-t0a),

      sparks(8,t.x,t.y,t.z,now,R2*2.2);

      const [u2,v2]=basis(V.norm([Math.random()-0.5,Math.random()-0.5,Math.random()-0.5]));

        flash(t.x+dv[0]*L2*0.7,t.y+dv[1]*L2*0.7,t.z+dv[2]*L2*0.7,now+0.12,R2*0.5,2);

      flash(t.x,t.y,t.z,now+1.45,big*1.2,2);
      sparks(10,t.x,t.y,t.z,now+1.45,R2*2.2);

function fireBeam(s,t,now,ox,oy,oz,dmg,heavy){

function spawnBreakup(s,now){

      v[1]*caT+(dax[2]*v[0]-dax[0]*v[2])*saT+dax[1]*dot2*(1-caT),
      v[2]*caT+(dax[0]*v[1]-dax[1]*v[0])*saT+dax[2]*dot2*(1-caT)];
  };

    const wox=cy*rl0[0]-sy*rl0[2],woy=rl0[1],woz=sy*rl0[0]+cy*rl0[2];
    const rl=Math.hypot(wox,woy,woz)||1;

    const fvx=(s.dvx||0)+tvx+wox/rl*outw+(Math.random()-0.5)*5;
    const fvy=(s.dvy||0)+woy/rl*outw*0.7+(Math.random()-0.5)*4;
    const fvz=(s.dvz||0)+tvz+woz/rl*outw+(Math.random()-0.5)*5;

    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0,3,gl.FLOAT,false,12,0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,f2.i,gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    wrecks.push({vao,vbo,ibo,icount:f2.i.length,v:f2.v,i:f2.i,rad:Math.max(3,f2.r||6),
      x:s.x+wox,y:s.y+woy,z:s.z+woz,yaw:s.yaw,
      bax:[dax[0],dax[1],dax[2]],bang:angT,uid:wreckUid++,
      vx:fvx,vy:fvy,vz:fvz,
      ax:V.norm([dax[0]+(Math.random()-0.5)*0.7,
                 dax[1]+(Math.random()-0.5)*0.7,
                 dax[2]+(Math.random()-0.5)*0.7]),
      spin:sp3*0.6+(0.15+Math.random()*0.5)
            *Math.min(1,14/Math.sqrt((f2.r||6)+4))*(Math.random()<0.5?-1:1),

function kill(t,now){

        for(const v of ships){

          const e2=(v.x-mi.x)*(v.x-mi.x)+(v.y-mi.y)*(v.y-mi.y)+(v.z-mi.z)*(v.z-mi.z);
          if(e2>4900)continue;

    a[i*4]=Math.cos(ph)*rr2*d;a[i*4+1]=u*d;a[i*4+2]=Math.sin(ph)*rr2*d;
    a[i*4+3]=R()<0.08?2.8+R()*1.8:0.8+R()*2.2;

function camBasis(){
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const f=[cy*cp,sp,sy*cp],r=[-sy,0,cy];
  return [f,r,V.cross(r,f)];
}
function mat(){
  const [f,r,u]=camBasis();
  const e=[cam.ex,cam.ey,cam.ez];
  const zn=0.6,zf=sceneR*9,t=1/Math.tan(0.44),ar=cvs.width/cvs.height;
  const vx=r,vy=u,vz=[-f[0],-f[1],-f[2]];
  const tx=-V.dot(vx,e),ty=-V.dot(vy,e),tz=-V.dot(vz,e);
  const A=t/ar,Bq=t,C=(zf+zn)/(zn-zf),D=2*zf*zn/(zn-zf);
  return new Float32Array([
    A*vx[0],Bq*vy[0],C*vz[0],-vz[0],
    A*vx[1],Bq*vy[1],C*vz[1],-vz[1],
    A*vx[2],Bq*vy[2],C*vz[2],-vz[2],
    A*tx,Bq*ty,C*tz+D,-tz]);
}
function frustumPlanes(m){
  const row=i=>[m[i],m[4+i],m[8+i],m[12+i]];
  const r0=row(0),r1=row(1),r2=row(2),r3=row(3),P=[];
  for(const rr2 of [r0,r1,r2]){
    P.push([r3[0]+rr2[0],r3[1]+rr2[1],r3[2]+rr2[2],r3[3]+rr2[3]]);
    P.push([r3[0]-rr2[0],r3[1]-rr2[1],r3[2]-rr2[2],r3[3]-rr2[3]]);
  }
  return P;
}
function sphereVis(P,x,y,z,r){
  for(let i=0;i<6;i++){
    const p=P[i];
    if(p[0]*x+p[1]*y+p[2]*z+p[3]<-r)return false;
  }
  return true;
}
function pickShip(px,py){
  const m=mat(),rect=cvs.getBoundingClientRect();
  let best=null,bd=28*28;
  for(const s of ships){
    if(s.dead||!s.vao)continue;
    const x=s.x,y=s.y,z=s.z;
    const cx=m[0]*x+m[4]*y+m[8]*z+m[12];
    const cy2=m[1]*x+m[5]*y+m[9]*z+m[13];
    const cw=m[3]*x+m[7]*y+m[11]*z+m[15];
    if(cw<1)continue;
    const sx=(cx/cw*0.5+0.5)*rect.width,sy=(0.5-cy2/cw*0.5)*rect.height;
    const d=(sx-px)*(sx-px)+(sy-py)*(sy-py);
    const rad=Math.max(20,s.slen*0.5/cw*rect.height);
    if(d<Math.max(bd,rad*rad)&&d<bd*4){if(d<bd||rad>20){best=s.id;bd=Math.min(bd,d);}}
  }

}

/* ===================== frame ===================== */
let lastT=0,fpsA=60,statT=0;
function frame(nowMs){
  requestAnimationFrame(frame);
  const now=nowMs/1000;
  const dt=Math.min(0.05,lastT?now-lastT:0.016);
  lastT=now;
  fpsA+=((dt>0?1/dt:60)-fpsA)*0.05;
  simStep(now,dt);
  /* camera: free flight, or a pursuit orbit around the chosen combatant */
  if(sel!=null&&ships[sel]&&!ships[sel].dead){
    const s=ships[sel];
    if(!orb)orb={dist:Math.max(26,s.slen*2.4),yaw:cam.yaw+Math.PI,pitch:0.3};
    const cp=Math.cos(orb.pitch),sp=Math.sin(orb.pitch);
    const want=[s.x+orb.dist*cp*Math.cos(orb.yaw),s.y+orb.dist*sp,s.z+orb.dist*cp*Math.sin(orb.yaw)];
    const k=1-Math.exp(-dt*5);
    cam.ex+=(want[0]-cam.ex)*k;cam.ey+=(want[1]-cam.ey)*k;cam.ez+=(want[2]-cam.ez)*k;
    const dx=s.x-cam.ex,dy=s.y-cam.ey,dz=s.z-cam.ez;
    cam.yaw=Math.atan2(dz,dx);
    cam.pitch=Math.atan2(dy,Math.hypot(dx,dz));
  }else{
    const [f,r]=camBasis();
    const sp=(keys.has("shift")?900:280)*dt;
    if(keys.has("w")){cam.ex+=f[0]*sp;cam.ey+=f[1]*sp;cam.ez+=f[2]*sp;}
    if(keys.has("s")){cam.ex-=f[0]*sp;cam.ey-=f[1]*sp;cam.ez-=f[2]*sp;}
    if(keys.has("a")){cam.ex-=r[0]*sp;cam.ez-=r[2]*sp;}
    if(keys.has("d")){cam.ex+=r[0]*sp;cam.ez+=r[2]*sp;}
    if(keys.has("q"))cam.ey-=sp;
    if(keys.has("e"))cam.ey+=sp;
  }
  const m=mat(),eye=[cam.ex,cam.ey,cam.ez];
  const FRP=frustumPlanes(m);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  /* stars */
  gl.useProgram(starProg);
  gl.uniformMatrix4fv(USvp,false,m);
  gl.uniform3fv(USink,inkc);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
  gl.bindVertexArray(starVao);
  gl.drawArrays(gl.POINTS,0,starN);
  gl.depthMask(true);gl.disable(gl.BLEND);
  /* whatever hangs in this war's sky, slowly turning */
  if(celes.length){
    gl.useProgram(celProg);
    gl.uniformMatrix4fv(CU.vp,false,m);
    gl.uniform3fv(CU.ink,inkc);
    gl.uniform3fv(CU.bg,bgc);
    for(const c3 of celes){
      const an=now*c3.rate+c3.ph;
      gl.uniform3f(CU.pos,c3.x,c3.y,c3.z);
      gl.uniform2f(CU.spin,Math.cos(an),Math.sin(an));
      gl.uniform1f(CU.alpha,c3.alpha);
      gl.uniform1f(CU.haze,c3.haze);
      if(c3.alpha<0.99){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);}
      gl.bindVertexArray(c3.vao);
      gl.drawElements(gl.TRIANGLES,c3.icount,gl.UNSIGNED_INT,0);
      if(c3.alpha<0.99){gl.depthMask(true);gl.disable(gl.BLEND);}
    }
  }
  /* the combatants */
  gl.useProgram(shipProg);
  gl.uniformMatrix4fv(SU.vp,false,m);
  gl.uniform3fv(SU.eye,eye);
  gl.uniform3fv(SU.ink,inkc);
  gl.uniform3fv(SU.bg,bgc);
  gl.uniform1f(SU.fog,0.14/sceneR);
  gl.uniform1f(SU.t,now);
  const T=now-warT0;
  let alive=0;
  for(const s of ships){
    if(!s.vao)continue;
    if(s.dead){
      /* a corpse: whole, dark, drifting on her death momentum */
      if(now-(s.deadT||0)>4){
        dustBurst(s.x,s.y,s.z,s.dvx||0,s.dvy||0,s.dvz||0,16,now);
        gl.deleteVertexArray(s.vao);gl.deleteBuffer(s.vbo);gl.deleteBuffer(s.ibo);s.vao=null;
        continue;
      }
      s.x+=(s.dvx||0)*dt;s.y+=(s.dvy||0)*dt;s.z+=(s.dvz||0)*dt;
      if(!sphereVis(FRP,s.x,s.y,s.z,s.slen*0.8))continue;
      const dax=s.dax||[0,1,0];
      gl.uniform3f(SU.pos,s.x,s.y,s.z);
      gl.uniform2f(SU.yaw,Math.cos(s.yaw),Math.sin(s.yaw));
      gl.uniform4f(SU.rot,dax[0],dax[1],dax[2],(s.dang||0)+(now-s.deadT)*(s.corpseSpin||0.4));
      gl.uniform1f(SU.inz,1.0);
      gl.uniform1f(SU.hurt,Math.max(0,1.2-(now-s.deadT))*0.5);
      gl.uniform1f(SU.tone,0.6);
      gl.uniform4f(SU.anim,0,0,1,0);
      gl.bindVertexArray(s.vao);
      gl.drawElements(gl.TRIANGLES,s.icount,gl.UNSIGNED_INT,0);
      continue;
    }
    const age=warT0===Infinity?-1:T-s.delay;
    if(age<0)continue;
    alive++;
    if(!sphereVis(FRP,s.x,s.y,s.z,s.slen*0.8))continue;
    const slide=SLIDE*Math.exp(-Math.max(0,age)*3.4);
    const cy=Math.cos(s.yaw),sy=Math.sin(s.yaw);
    gl.uniform3f(SU.pos,s.x-cy*slide,s.y,s.z-sy*slide);
    gl.uniform2f(SU.yaw,cy,sy);
    const pose=xPose(s,now);
    gl.uniform4f(SU.rot,pose.ax[0],pose.ax[1],pose.ax[2],pose.ang);
    if(s.side)gl.uniform4f(SU.anim,1.0,s.wf,Math.max(4,s.slen*0.35),
      Math.min(6,1.3+30/s.slen));
    else gl.uniform4f(SU.anim,0,0,1,0);
    gl.uniform1f(SU.inz,Math.min(1,age/0.3));
    gl.uniform1f(SU.hurt,Math.max(0,Math.exp(-(now-s.hurtT)*7))*0.85);
    gl.uniform1f(SU.tone,s.side?0.90:1.0);
    gl.bindVertexArray(s.vao);
    gl.drawElements(gl.TRIANGLES,s.icount,gl.UNSIGNED_INT,0);
  }
  /* the litter of the war: charred pieces adrift, tumbling where they
     died — and beneath them the boneyard, every earlier piece kept */
  gl.uniform1f(SU.inz,1.0);
  gl.uniform1f(SU.hurt,0.0);
  gl.uniform1f(SU.tone,0.42);
  gl.uniform2f(SU.yaw,1.0,0.0);
  gl.uniform4f(SU.rot,0.0,1.0,0.0,0.0);
  gl.uniform4f(SU.anim,0,0,1,0);
  for(const b of boneyard){
    const bt=now-(b.t0||now);
    gl.uniform3f(SU.pos,(b.dvx||0)*bt,(b.dvy||0)*bt,(b.dvz||0)*bt);
    gl.bindVertexArray(b.vao);
    gl.drawElements(gl.TRIANGLES,b.icount,gl.UNSIGNED_INT,0);
  }
  let anyGone=false;
  for(const w of wrecks){
    if(w.gone)continue;
    if(!w.pending){
      /* a piece coasts until she has genuinely stopped — no drag out
         here: she flies at the speed she was thrown at, forever, unless
         she bangs into something that stops her */
      if(w.shatter){
        dustBurst(w.x,w.y,w.z,w.vx,w.vy,w.vz,14,now);
        gl.deleteVertexArray(w.vao);gl.deleteBuffer(w.vbo);gl.deleteBuffer(w.ibo);
        w.gone=true;anyGone=true;continue;
      }
      const wsp=Math.hypot(w.vx,w.vy,w.vz);
      if(now-w.t0>(w.life||38))w.shatter=true;   /* old bones become mist */
      if(wsp<1.2){
        if(wsp>0.05){const f3=1.2/wsp;w.vx*=f3;w.vy*=f3;w.vz*=f3;}
        else{const a5=Math.random()*6.283;
          w.vx=Math.cos(a5)*1.2;w.vy=(Math.random()-0.5)*0.8;w.vz=Math.sin(a5)*1.2;}
      }
      w.x+=w.vx*dt;w.y+=w.vy*dt;w.z+=w.vz*dt;
    }
    if(!sphereVis(FRP,w.x,w.y,w.z,(w.rad||6)*1.6))continue;
    gl.uniform3f(SU.pos,w.x,w.y,w.z);
    gl.uniform2f(SU.yaw,Math.cos(w.yaw),Math.sin(w.yaw));
    if(w.pending)gl.uniform4f(SU.rot,w.fAx[0],w.fAx[1],w.fAx[2],w.fAng);
    else{
      const wr=xQAA(w.bax||[0,1,0],w.bang||0,w.ax,w.spin*(now-w.t0));
      gl.uniform4f(SU.rot,wr.ax[0],wr.ax[1],wr.ax[2],wr.ang);
    }
    gl.bindVertexArray(w.vao);
    gl.drawElements(gl.TRIANGLES,w.icount,gl.UNSIGNED_INT,0);
  }
  if(anyGone)wrecks=wrecks.filter(w=>!w.gone);
  /* a massacre can flood the sky with tumbling pieces; past the budget,
     the oldest flyers settle early rather than the frame rate */
  let liveW=0;
  for(const w of wrecks)if(!w.pending&&!w.gone)liveW++;
  if(liveW>600)for(const w of wrecks){
    if(w.pending||w.gone||w.shatter)continue;
    w.shatter=true;
    if(--liveW<=600)break;
  }
  if(pendI.length&&(now-lastBake>1.6||pendI.length>500000)){lastBake=now;bakeBoneyard();}
  /* beams */
  if(beams.length){
    gl.useProgram(beamProg);
    gl.uniformMatrix4fv(BU.vp,false,m);
    gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
    gl.bindVertexArray(beamVao);
    for(const side of [0,1]){
      const arr=[];
      for(const b of beams)if(b.side===side&&!b.ion&&!b.arc&&!b.rail&&!b.cut){
        arr.push(b.a[0],b.a[1],b.a[2],b.b[0],b.b[1],b.b[2]);

          arr.push(b.a[0],b.a[1]+1.1,b.a[2],b.b[0],b.b[1]+1.1,b.b[2]);
          arr.push(b.a[0],b.a[1]-1.1,b.a[2],b.b[0],b.b[1]-1.1,b.b[2]);
        }
      }
      if(arr.length){
        gl.bindBuffer(gl.ARRAY_BUFFER,beamVbo);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STREAM_DRAW);

        gl.drawArrays(gl.LINES,0,arr.length/3);
      }
      if(side===0){
        /* explosion sparks: ember streaks, no faction colour */
        const sarr=[];
        for(const b of beams)if(b.spark&&b.t0<=now)
          sarr.push(b.a[0],b.a[1],b.a[2],b.b[0],b.b[1],b.b[2]);
        if(sarr.length){
          gl.bindBuffer(gl.ARRAY_BUFFER,beamVbo);
          gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(sarr),gl.STREAM_DRAW);
          gl.uniform4f(BU.col,1.0,0.58,0.22,0.6);
          gl.drawArrays(gl.LINES,0,sarr.length/3);
        }
      }
      /* the ion lance: a fat bundle of lines that collapses as it dies,
         faction-vivid around a white-hot core */
      for(const b of beams){
        if(b.side!==side||!b.ion)continue;
        const k2=1-(now-b.t0)/0.9;
        const dir=V.norm(V.sub(b.b,b.a));
        const [bu,bv]=basis(dir);
        const mk2=r2=>{
          const a2=[];
          for(let j=0;j<8;j++){
            const an=j/8*6.283;
            const off=V.add(V.mul(bu,Math.cos(an)*r2*k2),V.mul(bv,Math.sin(an)*r2*k2));
            a2.push(b.a[0]+off[0],b.a[1]+off[1],b.a[2]+off[2],
                    b.b[0]+off[0],b.b[1]+off[1],b.b[2]+off[2]);
          }
          return a2;
        };
        gl.bindBuffer(gl.ARRAY_BUFFER,beamVbo);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(mk2(4.2)),gl.STREAM_DRAW);
        const ic=IONCOL[side];
        gl.uniform4f(BU.col,ic[0],ic[1],ic[2],0.85*k2+0.1);
        gl.drawArrays(gl.LINES,0,16);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(mk2(1.4)),gl.STREAM_DRAW);
        gl.uniform4f(BU.col,1.0,1.0,1.0,0.9*k2+0.1);
        gl.drawArrays(gl.LINES,0,16);
        if(now-b.t0<0.18){
          gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(mk2(9.0)),gl.STREAM_DRAW);
          gl.uniform4f(BU.col,1.0,1.0,1.0,0.55);
          gl.drawArrays(gl.LINES,0,16);
        }
      }
      /* arc lightning: rebuilt jagged every frame, so it crackles */
      const aarr=[];
      for(const b of beams){
        if(b.side!==side||!b.arc)continue;
        let px=b.a[0],py=b.a[1],pz=b.a[2];
        for(let j=1;j<=5;j++){
          const u2=j/5;
          const jx=b.a[0]+(b.b[0]-b.a[0])*u2+(j<5?(Math.random()-0.5)*9:0);
          const jy=b.a[1]+(b.b[1]-b.a[1])*u2+(j<5?(Math.random()-0.5)*9:0);
          const jz=b.a[2]+(b.b[2]-b.a[2])*u2+(j<5?(Math.random()-0.5)*9:0);
          aarr.push(px,py,pz,jx,jy,jz);
          px=jx;py=jy;pz=jz;
        }
      }
      if(aarr.length){
        gl.bindBuffer(gl.ARRAY_BUFFER,beamVbo);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(aarr),gl.STREAM_DRAW);
        const c=BEAMCOL[side];
        gl.uniform4f(BU.col,(c[0]+2)/3,(c[1]+2)/3,(c[2]+2)/3,0.95);
        gl.drawArrays(gl.LINES,0,aarr.length/3);
      }
      /* railshots: a spear of white with the fleet's colour bleeding off it */
      const rarr=[];
      for(const b of beams)if(b.side===side&&b.rail){
        rarr.push(b.a[0],b.a[1],b.a[2],b.b[0],b.b[1],b.b[2]);
        rarr.push(b.a[0],b.a[1]+0.9,b.a[2],b.b[0],b.b[1]+0.9,b.b[2]);
      }
      if(rarr.length){
        gl.bindBuffer(gl.ARRAY_BUFFER,beamVbo);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(rarr),gl.STREAM_DRAW);
        gl.uniform4f(BU.col,1.0,1.0,1.0,0.9);
        gl.drawArrays(gl.LINES,0,rarr.length/3);
      }
      /* the cutter's held beam, bright and continuous */
      const carr=[];
      for(const b of beams)if(b.side===side&&b.cut)
        carr.push(b.a[0],b.a[1],b.a[2],b.b[0],b.b[1],b.b[2]);
      if(carr.length){
        gl.bindBuffer(gl.ARRAY_BUFFER,beamVbo);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(carr),gl.STREAM_DRAW);
        const c=BEAMCOL[side];
        gl.uniform4f(BU.col,(c[0]+1)/2,(c[1]+1)/2,(c[2]+1)/2,0.85);
        gl.drawArrays(gl.LINES,0,carr.length/3);
      }
      /* tracer fire: short bright rounds you can watch fly */
      const trr=[];
      for(const tr of tracers)if(tr.side===side)
        trr.push(tr.x,tr.y,tr.z,tr.x-tr.vx*0.035,tr.y-tr.vy*0.035,tr.z-tr.vz*0.035);
      if(trr.length){
        gl.bindBuffer(gl.ARRAY_BUFFER,beamVbo);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(trr),gl.STREAM_DRAW);
        const c=BEAMCOL[side];
        gl.uniform4f(BU.col,(c[0]+1)/2,(c[1]+1)/2,(c[2]+1)/2,0.95);
        gl.drawArrays(gl.LINES,0,trr.length/3);
      }
      /* seeker trails ride the same colour as their fleet's fire */
      const tarr=[];
      for(const ms of missiles)if(ms.side===side)
        tarr.push(ms.x,ms.y,ms.z,ms.x-ms.vx*0.12,ms.y-ms.vy*0.12,ms.z-ms.vz*0.12);
      if(tarr.length){
        gl.bindBuffer(gl.ARRAY_BUFFER,beamVbo);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(tarr),gl.STREAM_DRAW);
        const c=BEAMCOL[side];
        gl.uniform4f(BU.col,c[0],c[1],c[2],0.7);
        gl.drawArrays(gl.LINES,0,tarr.length/3);
      }
    }
    /* mines and seeker heads: little lit points, pulsing on their own clocks */
    gl.useProgram(starProg);
    gl.uniformMatrix4fv(USvp,false,m);
    for(const side of [0,1]){
      const pa=[];
      for(const mi of mines)if(mi.side===side)
        pa.push(mi.x,mi.y,mi.z,3.0+Math.sin(now*4+mi.ph)*1.4);
      for(const ms of missiles)if(ms.side===side)pa.push(ms.x,ms.y,ms.z,3.6);
      for(const pl of plasmas)if(pl.side===side)
        pa.push(pl.x,pl.y,pl.z,6.5+Math.sin(now*9+pl.ph)*1.8);
      if(pa.length){
        gl.bindVertexArray(mmVao);
        gl.bindBuffer(gl.ARRAY_BUFFER,mmVbo);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pa),gl.STREAM_DRAW);
        gl.uniform3fv(USink,BEAMCOL[side]);
        gl.drawArrays(gl.POINTS,0,pa.length/4);
      }
    }
    /* the dust of the dead: faint motes drifting off with the momentum */
    if(dusts.length){
      const nd2=Math.min(dusts.length,8192);
      for(let i=0;i<nd2;i++){
        const du=dusts[i];
        duPool[i*4]=du.x;duPool[i*4+1]=du.y;duPool[i*4+2]=du.z;
        duPool[i*4+3]=Math.max(0.5,2.2*(1-(now-du.t0)/9));
      }
      gl.bindVertexArray(mmVao);
      gl.bindBuffer(gl.ARRAY_BUFFER,mmVbo);
      gl.bufferData(gl.ARRAY_BUFFER,duPool.subarray(0,nd2*4),gl.STREAM_DRAW);
      gl.uniform3f(USink,inkc[0]*0.7,inkc[1]*0.7,inkc[2]*0.7);
      gl.drawArrays(gl.POINTS,0,nd2);
    }
    gl.depthMask(true);gl.disable(gl.BLEND);
  }
  /* flashes: arrivals, impacts, deaths */
  if(flashes.length){
    const live=[];
    for(const f2 of flashes)if(now-f2.t0<0.8)live.push(f2);
    flashes=live;
    if(live.length){
      const nfl=Math.min(live.length,1600);
      for(let i=0;i<nfl;i++){
        const f2=live[i];
        flPool[i*7]=f2.x;flPool[i*7+1]=f2.y;flPool[i*7+2]=f2.z;flPool[i*7+3]=f2.t0;
        flPool[i*7+4]=f2.size;flPool[i*7+5]=f2.c;flPool[i*7+6]=f2.seed||0;
      }
      const arr=flPool.subarray(0,nfl*7);
      gl.useProgram(flashProg);
      gl.uniformMatrix4fv(FU.vp,false,m);
      gl.uniform1f(FU.t,now);
      gl.uniform1f(FU.px,cvs.height*0.9);
      gl.uniform3fv(FU.c0,BEAMCOL[0]);
      gl.uniform3fv(FU.c1,BEAMCOL[1]);
      gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
      gl.bindVertexArray(flVao);
      gl.bindBuffer(gl.ARRAY_BUFFER,flVbo);
      gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STREAM_DRAW);
      gl.drawArrays(gl.POINTS,0,live.length);
      gl.depthMask(true);gl.disable(gl.BLEND);
    }
  }
  gl.bindVertexArray(null);
  if(now-statT>0.25){
    statT=now;
    if(rosterDirty)rosterDraw();
    if(fpsA<45&&dpr>1.01){dpr=Math.max(1,dpr*0.85);resize();}
    else if(fpsA>57&&dpr<Math.min(devicePixelRatio||1,2)){dpr=Math.min(devicePixelRatio||1,2,dpr*1.08);resize();}
    const st=document.getElementById("stat");
    if(forged<total)st.textContent="FORGING THE FLEETS · "+forged+" / "+total;
    else if(winner!=null)st.textContent=SIDE_NAME[winner]+" HOLDS THE SKY · N FOR THE NEXT WAR · "+Math.round(fpsA)+" FPS";
    else st.textContent="WAR · "+alive+" SHIPS ENGAGED · "+Math.round(fpsA)+" FPS";
    if(sel!=null&&ships[sel]&&ships[sel].meta){
      const el=document.getElementById("chp");
      if(el)el.textContent=Math.ceil(ships[sel].hp)+"/"+ships[sel].hpMax;
    }
  }
}
let rosterDirty=true;
function roster(){rosterDirty=true;}
function rosterDraw(){
  rosterDirty=false;
  document.getElementById("roster").innerHTML=
    "<div><span class=\"cnt\">"+SIDE_NAME[0]+"</span> · "+counts[0]+"</div>"+
    "<div><span class=\"cnt\">"+SIDE_NAME[1]+"</span> · "+counts[1]+"</div>";
}
applyPal();resize();makeStars();
toast("FLEETS INBOUND");
startWar(true);
requestAnimationFrame(frame);

</script>
