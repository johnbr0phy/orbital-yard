<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tribute · Captain studies</title><style>body{margin:0;background:#101820;color:#d5e2ea;font:15px system-ui}main{max-width:850px;margin:5vh auto;padding:24px}a{color:#aacdd5}h1{font-size:26px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;background:#203342;color:#d5e2ea;padding:10px;border:1px solid #68828e;border-radius:4px}canvas{width:100%;display:block;margin:24px 0;background:#0b131b}p{color:#a7bac6}button:focus-visible{outline:2px solid #ccecf1}</style><main><a href="armada-war-tribute-new.html">← Battle</a><h1>Captain studies</h1><nav><label>Fleet <select id="race"></select></label><label>Identity <input id="seed" type="number" value="42" style="width:110px"></label><button id="next">Another captain</button><select id="feeling" aria-label="Emotion"><option value="0">Focused</option><option value=".55">Tense</option><option value=".95">Afraid</option><option value="hit">Under fire</option></select><button id="motion">Animate</button></nav><canvas id="portrait" width="520" height="300"></canvas><h2 id="name"></h2><p>Species-specific anatomy, built in 3D: carapaces, mandibles, bone crests, sensory organs and encounter suits. Each captain keeps their own proportions and markings.</p></main><script src="armada-crew-new.js?v=fleets-23"></script><script>
const $=id=>document.getElementById(id);for(let r=0;r<23;r++){const o=document.createElement('option');o.value=r;o.textContent=ArmadaCrew.profile(42,r).kind;$('race').append(o)}$('race').value=8;let timer=0,t=0;
function draw(){const p=ArmadaCrew.profile(Number($('seed').value)||0,Number($('race').value)),v=$('feeling').value;ArmadaCrew.draw($('portrait'),p,{fear:v==='hit'?.65:Number(v),hit:v==='hit'?1:0},t);$('name').textContent=p.role+' '+p.name+' · '+p.species;}
for(const id of ['race','seed','feeling'])$(id).onchange=draw;$('next').onclick=()=>{$('seed').value=(Number($('seed').value)+7919)>>>0;draw()};$('motion').onclick=()=>{if(timer){clearInterval(timer);timer=0;$('motion').textContent='Animate'}else{timer=setInterval(()=>{t+=.1;draw()},100);$('motion').textContent='Pause'}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer)$('motion').click()});draw();
</script></html>
