<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tribute Sound Board</title>
<style>
:root{--bg:#0b0d12;--fg:#e8eaf0;--mut:#8a91a3;--card:#151923;--line:#252b38;--acc:#7fb3ff}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fa;--fg:#161a22;--mut:#5a6173;--card:#fff;--line:#dfe3ea;--acc:#1f5fd1}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:16px;max-width:980px;margin:auto}
h1{font-size:20px;margin:0 0 4px}p{color:var(--mut);margin:0 0 16px}h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:24px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.c b{display:block;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}.row span{color:var(--mut);font-size:12px;width:52px}
button{background:transparent;color:var(--acc);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
button.on{background:var(--acc);color:var(--bg)}
</style></head><body>
<h1>Tribute Sound Board</h1><p>Every recording the battle page uses. Tap to play; tap again to stop.</p>
<div id="app"></div>
<script>
const FLEETS=["The Yard Fleet","The Shoal","The Lattice","The Drift","The Choir","The Imperial Starfleet","The Rebel Alliance","The Minbari Federation","The Shadows","EarthForce","The Federation","The Klingon Empire","The Borg Collective","The Mondoshawan","The USCM Task Force","The Engineers","The Yautja Clans","The First Ones","Romulan Star Empire","The Dominion","Space Marines","Tyranids","Tesla"];
let cur=null,curB=null;
function btn(label,file,loop){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{
 if(cur){cur.pause();curB.classList.remove('on');if(curB===b){cur=null;return;}}
 cur=new Audio(file);cur.loop=!!loop;cur.play();curB=b;b.classList.add('on');cur.onended=()=>b.classList.remove('on');};return b;}
function row(label,files,loop){const r=document.createElement('div');r.className='row';const s=document.createElement('span');s.textContent=label;r.append(s);(files||[]).forEach((f,i)=>r.append(btn(String(i+1),f,loop)));return r;}
fetch('manifest.json').then(r=>r.json()).then(({roles})=>{
 const app=document.getElementById('app'),sec=(t,cards)=>{const h=document.createElement('h2');h.textContent=t;const g=document.createElement('div');g.className='grid';cards.forEach(c=>g.append(c));app.append(h,g);};
 const card=(title,rows)=>{const c=document.createElement('div');c.className='c';const b=document.createElement('b');b.textContent=title;c.append(b,...rows);return c;};
 sec('Score and bed',[card('Orchestral battle score',[row('loop',roles.music,true)]),card('Distant battle bed',[row('loop',roles.ambience,true)]),card('Capital-kill stinger',[row('hit',roles.stinger)])]);
 sec('Fleets',FLEETS.map((n,i)=>card(n,[row('gun',roles['shot-'+i]),row('beam',roles['beam-'+i]),row('engine',roles['engine-'+i],true)])));
 sec('Explosions',[0,1,2,3].map(t=>card(['Fighter','Frigate','Capital','First One'][t],[row('blast',roles['explosion'+t])])));
 sec('Death styles',Object.keys(roles).filter(k=>k.startsWith('boom-')).map(k=>card(k.slice(5),[row('layer',roles[k])])));
 sec('Shared hardware',['arc','rail','ion-charge','ion-fire'].map(k=>card(k,[row('shot',roles[k])])));
});
</script></body></html>
