/* ---- dress ---------------------------------------------------------------
   What a hull wears when she is the one being looked at. Built from her
   finished parts list in the same surface parameter space the fit-out uses,
   and kept in separate groups rather than tagged per vertex: the fleet pays
   nothing for a material channel it never reads, and the one ship being
   looked at gets her materials from a uniform and an extra draw call. */
function dressOf(ship,seed){
  const R=mulberry32((seed^0x9e3779b9)>>>0), rr=(a,b)=>a+(b-a)*R();
  const glass=[],paint=[];
  const bb=ship.bb;
  const diag=Math.hypot(bb[1][0]-bb[0][0],bb[1][1]-bb[0][1],bb[1][2]-bb[0][2])||1;
  const solids=ship.parts;
  /* A window has to be ON the ship, which is not the same as being on a part
     of her: the first pass hung them off whatever tubes were longest, and on a
     delta the longest tubes are internal spars buried inside the wing, so
     ninety lit ports were forged inside the hull where nobody could see them.
     Every port is now tested against the whole ship before it is kept. */
  const clear=q=>{for(const c of solids)if(inSolid(q,c))return false;return true;};
  const sizeOf=p=>p.k==="sphere"?p.r*2.2
    :p.k==="box"?Math.max(V.len(p.u),V.len(p.v),V.len(p.w))*2
    :p.k==="panel"?p.th*10
    :p.k==="tube"||p.k==="capsule"?V.len(V.sub(p.b,p.a))
    :0;
  const hosts=ship.parts.filter(p=>!p.bare&&sizeOf(p)>diag*0.07&&
    (p.k==="tube"||p.k==="capsule"||p.k==="sphere"||p.k==="box"||p.k==="panel"));
  hosts.sort((a,b)=>sizeOf(b)-sizeOf(a));
  const use=hosts.slice(0,7);
  let kept=0;
  for(let bi=0;bi<use.length&&kept<120;bi++){
    const p=use[bi];
    const S=surfaceOf(p,R); if(!S||!S.at) continue;
    const span=S.span||sizeOf(p);
    const w=Math.max(diag*0.0045,Math.min(diag*0.016,span*0.035))*rr(0.85,1.12);
    /* a run of ports: down both flanks of a round body, in rows across a flat
       one. The step is taken in the surface's own parameters, so it follows
       the form the same way the hatching in the yard does. */
    const lines=S.flat?[[0.5,0],[0.5,1],[0.28,0],[0.72,0]]:[[0,0],[0.5,0],[0.26,0],[0.74,0]];
    const nl=S.flat?2+Math.floor(R()*2):2;
    for(let li=0;li<nl;li++){
      const base=lines[li];
      const n=Math.max(3,Math.min(12,Math.round(span/(w*5.5))));
      for(let k=0;k<n;k++){
        const t=0.14+0.72*(n===1?0.5:k/(n-1));
        const u=S.flat?t:base[0]+rr(-0.02,0.02);
        const v=S.flat?base[0]+(li>1?rr(-0.16,0.16):0):t;
        const uu=S.flat?u:u, vv=S.flat?Math.max(0.08,Math.min(0.92,v)):v;
        if(S.ok&&!S.ok(uu,vv))continue;
        const A=S.at(uu,vv);
        if(!A)continue;
        const B2=S.at(S.flat?Math.min(0.99,uu+0.012):uu,S.flat?vv:Math.min(0.995,vv+0.012));
        if(!B2)continue;
        const d=V.sub(B2.q,A.q), dl=V.len(d);
        if(dl<1e-6)continue;
        const e1=V.mul(d,1/dl), e2=V.norm(V.cross(A.n,e1));
        /* proud of the plating, and only if the plating is the outside */
        if(!clear(V.add(A.q,V.mul(A.n,w*1.1))))continue;
        glass.push(BOX(V.add(A.q,V.mul(A.n,w*0.24)),
          V.mul(e1,w),V.mul(e2,w*rr(0.5,0.8)),V.mul(A.n,w*0.30)));
        kept++;
      }
    }
    /* a painted band round the two biggest round bodies */
    if(paint.length<40&&(p.k==="tube"||p.k==="capsule")){
      const c0=rr(0.16,0.58), cw=rr(0.05,0.12);
      const rAt=t=>p.k==="capsule"?p.r:p.r1+(p.r2-p.r1)*t;
      paint.push(TUB(V.lerp(p.a,p.b,c0),V.lerp(p.a,p.b,c0+cw),
                     rAt(c0)*1.016,rAt(c0+cw)*1.016));
      /* hazard chevrons ringing her thrust end */
      const rad=p.k==="capsule"?p.r:Math.max(p.r1,p.r2);
      const nch=6+Math.floor(R()*4);
      for(let k2=0;k2<nch;k2++){
        const A=S.at(k2/nch,0.93),B2=S.at(k2/nch,0.97);
        if(!A||!B2)continue;
        const d=V.sub(B2.q,A.q),dl=V.len(d); if(dl<1e-6)continue;
        const e1=V.mul(d,1/dl), e2=V.norm(V.cross(A.n,e1));
        if(!clear(V.add(A.q,V.mul(A.n,rad*0.05))))continue;
        paint.push(BOX(V.add(A.q,V.mul(A.n,rad*0.012)),
          V.mul(e1,rad*0.10),V.mul(e2,rad*0.17),V.mul(A.n,rad*0.030)));
      }
    }
  }
  return {glass,paint};
}

function ensureWorkers(){
  if(workers.length)return;
  const SRC=document.querySelector("script").textContent;
  const cut=SRC.indexOf("//__ARMADA_WORKER_CUT__");
  const url=URL.createObjectURL(new Blob([SRC.slice(0,cut)+WORKER_MAIN],{type:"text/javascript"}));
  const n=Math.min(8,Math.max(2,(navigator.hardwareConcurrency||4)-1));
  for(let i=0;i<n;i++){
    const w=new Worker(url);
    w.onmessage=onWorkerMsg;
    w.onerror=err=>console.error("worker:",err.message);
    workers.push(w);
  }
}
/* one ship at a time, freed the moment she is let go: at ~0.6 MB of mesh and
   64 KB of lettering, the dressed hull is invisible against a fleet that bakes
   two million triangles, and it stays that way because there is only ever one */
let luxShip=null;
function luxFree(){
  if(!luxShip)return;
  for(const g of luxShip.groups){
    gl.deleteVertexArray(g.vao);gl.deleteBuffer(g.vbo);gl.deleteBuffer(g.ibo);}
  luxShip=null;
}
function luxRequest(id){
  luxFree();
  if(id==null||!ships[id])return;
  workers[id%workers.length].postMessage(
    {kind:"lux",genId,id,seed:ships[id].seed,hulls:ships[id].hulls});
}
/* the lettering is drawn once, at the size it will be read at, into an alpha
   channel — the glyphs are the only thing the shader needs from it */
function onWorkerMsg(e){
  const d=e.data;
  if(d.genId!==genId)return;
  if(d.kind==="lux"){
    if(d.id!==sel||!ships[d.id])return;      /* she was let go while forging */
    luxFree();
    const s=ships[d.id],cy=Math.cos(s.yaw),sy=Math.sin(s.yaw);
    const place=(X,Y,Z)=>[cy*X*s.sc-sy*Z*s.sc+s.x, Y*s.sc+s.y, sy*X*s.sc+cy*Z*s.sc+s.z];
    const mk=(m,emis,paintMix)=>{
      if(!m)return null;
      const nv=m.v.length/3,out=new Float32Array(nv*4);
      for(let i=0,o2=0;i<m.v.length;i+=3){
        const w=place(m.v[i],m.v[i+1],m.v[i+2]);
        out[o2++]=w[0];out[o2++]=w[1];out[o2++]=w[2];out[o2++]=s.phase;
      }
      const vao=gl.createVertexArray(),vbo=gl.createBuffer(),ibo=gl.createBuffer();
      gl.bindVertexArray(vao);
      gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
      gl.bufferData(gl.ARRAY_BUFFER,out,gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0,4,gl.FLOAT,false,16,0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,m.i,gl.STATIC_DRAW);
      gl.bindVertexArray(null);
      return {vao,vbo,ibo,icount:m.i.length,emis,paintMix};
    };
    const groups=[mk(d.hull,0,0),mk(d.paint,0,1),mk(d.glass,1,0)].filter(Boolean);
    luxShip={id:d.id,groups};
    return;
  }
  if(d.kind==="batch"){
    for(const rec of d.out){admit(rec);forged++;}
    uploadDirty();flashUpload();roster();
    /* forge complete: every hull is on the GPU, so the whole muster can come
       through together and every one of them be seen doing it */
    if(forged>=forgeTotal)
      for(const ch of chunks.values())for(const l of ch.lod){l.v.a=null;l.i.a=null;}
  }else{
    hiPending.delete(d.id);
    if(d.id>=ships.length)return;
    const s=ships[d.id],m=d.mesh;
    const nv=m.v.length/3,out=new Float32Array(nv*4);
    const cy=Math.cos(s.yaw),sy=Math.sin(s.yaw);
    for(let i=0,o=0;i<m.v.length;i+=3){
      const X=m.v[i]*s.sc,Y=m.v[i+1]*s.sc,Z=m.v[i+2]*s.sc;
      out[o++]=cy*X-sy*Z+s.x;out[o++]=Y+s.y;out[o++]=sy*X+cy*Z+s.z;out[o++]=s.phase;
    }
    const vao=gl.createVertexArray(),vbo=gl.createBuffer(),ibo=gl.createBuffer();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
    gl.bufferData(gl.ARRAY_BUFFER,out,gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0,4,gl.FLOAT,false,16,0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,m.i,gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    hiCache.set(d.id,{vao,vbo,ibo,icount:m.i.length});
    while(hiCache.size>HI_CAP){
      const [k,e2]=hiCache.entries().next().value;
      gl.deleteVertexArray(e2.vao);gl.deleteBuffer(e2.vbo);gl.deleteBuffer(e2.ibo);
      hiCache.delete(k);
    }
  }
}

function startFleet(fresh){
  luxFree();
  if(fresh)fleetSeed=(Math.random()*4294967296)|0;
  genId++;
  disposeAll();
  const R=mulberry32(fleetSeed|0);
  jr=mulberry32((fleetSeed^0x9E3779B9)|0);
  forgeTotal=targetN+8;forged=0;
  RAD=62*Math.cbrt(targetN)+90;
  sceneR=RAD*1.35;
  jumpT0=0;                              /* w is absolute now; nothing to wait for */
  introArmed=true;
  forgeStart=performance.now()/1000;
  flashReset(forgeTotal);
  chunkSize=Math.max(240,RAD/2.6);
  makeStars();
  select(null);
  const ed=Math.hypot(cam.ex,cam.ey,cam.ez);
  if(ed<1||ed>sceneR*3)initCam();
  /* one seed per hull, all distinct — distinct seed, distinct ship */
  const ss=new Set();
  while(ss.size<targetN+8)ss.add((R()*4294967296)|0);
  const seeds=[...ss];
  /* the leviathans forge first: one of 50 hulls, two of 25, five of 10 */
  const MEGA=[[50,1.5],[25,1.35],[25,1.35],[10,1.2],[10,1.2],[10,1.2],[10,1.2],[10,1.2]];
  const jobs=MEGA.map((m,i)=>({seed:seeds[i],hulls:m[0],mul:m[1]}))
    .concat(seeds.slice(8).map((s,i)=>({seed:s,
      mul:i<Math.max(1,targetN*0.002)?2.4:i<targetN*0.02?1.7:i<targetN*0.12?1.3:1})));
  ensureWorkers();
  const B=16;
  for(let i=0,b=0;i<jobs.length;i+=B,b++)
    workers[b%workers.length].postMessage({kind:"batch",genId,jobs:jobs.slice(i,i+B)});
  roster();
}

/* ---- promotion: the ships you fly up to get re-forged at full facet count ---- */
let promoT=0;
function pickHi(eye,now){
  if(now-promoT<180||forged===0)return;promoT=now;
  const reach=chunkSize*1.2+900;
  const cands=[];
  let nd=1e9;
  for(const ch of chunks.values()){
    const dx=eye[0]-ch.cx,dy=eye[1]-ch.cy,dz=eye[2]-ch.cz;
    if(dx*dx+dy*dy+dz*dz>reach*reach)continue;
    for(const id of ch.ids){
      const s=ships[id];
      const d=Math.hypot(eye[0]-s.x,eye[1]-s.y,eye[2]-s.z);
      if(d<nd)nd=d;
      if(d<s.slen*30)cands.push([s.slen/Math.max(10,d),id]);
    }
  }
  nearestD=nd;
  cands.sort((a,b)=>b[0]-a[0]);
  activeHi=new Set(cands.slice(0,HI_N).map(c=>c[1]));
  if(sel!=null&&ships[sel])activeHi.add(sel);
  for(const id of activeHi){
    if(hiCache.has(id)){const e=hiCache.get(id);hiCache.delete(id);hiCache.set(id,e);continue;}
    if(hiPending.has(id))continue;
    hiPending.add(id);
    workers[id%workers.length].postMessage({kind:"hi",genId,id,seed:ships[id].seed,hulls:ships[id].hulls});
  }
}

/* ===================== stars ===================== */
let starVao=null,starN=0;
function makeStars(){
  const R=mulberry32(7);
  starN=3200;
  const a=new Float32Array(starN*4);
  for(let i=0;i<starN;i++){
    const u=R()*2-1,ph=R()*Math.PI*2,rr=Math.sqrt(1-u*u),d=sceneR*(4+R()*5);
    a[i*4]=Math.cos(ph)*rr*d;a[i*4+1]=u*d;a[i*4+2]=Math.sin(ph)*rr*d;
    a[i*4+3]=1+R()*1.8;
  }
  if(starVao)gl.deleteVertexArray(starVao);
  starVao=gl.createVertexArray();
  gl.bindVertexArray(starVao);
  const b=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,a,gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,4,gl.FLOAT,false,0,0);
  gl.bindVertexArray(null);
}

/* ===================== camera: free flight ===================== */
const cam={yaw:0,pitch:0,ex:0,ey:0,ez:0};
let dpr=Math.min(devicePixelRatio||1,2);

/* Where the opening shot ends: alongside the hull at the head of the muster.
   Standing off at the fleet's own radius is the right way to watch it arrive
   and the wrong place to be left afterwards — it is a diagram, not a berth. So
   once the last hull has stopped, the camera closes on the ship that came out
   of the jump in front of everybody and settles in beside her.
   "At the very front" is taken as the leading few per cent of the run rather
   than the single largest x, and the biggest hull in that band gets it: the
   literal frontmost ship is as likely as not a twelve metre launch, and being
   flown across the whole armada to arrive next to one is an anticlimax. */
let introArmed=false;
function leadShip(){
  if(!ships.length)return null;
  let xmax=-1e9,xmin=1e9;
  for(const s of ships){if(s.x>xmax)xmax=s.x;if(s.x<xmin)xmin=s.x;}
  const cut=xmax-(xmax-xmin)*0.06;
  let best=null;
  for(const s of ships)if(s.x>=cut&&(!best||s.slen>best.slen))best=s;
  return best;
}
function flyToLead(){
  const sh=leadShip();if(!sh)return;
  const d=Math.max(sh.slen*2.1,20);
  /* off her starboard bow and a little above: she keeps her own silhouette,
     and the fleet she came in ahead of fills the space behind her */
  const tgt=[sh.x+d*0.62, sh.y+d*0.30, sh.z+d*0.86];
  const f=V.norm([sh.x-tgt[0],sh.y-tgt[1],sh.z-tgt[2]]);
  let ty=Math.atan2(f[2],f[0]);
  while(ty-cam.yaw>Math.PI)ty-=Math.PI*2;
  while(ty-cam.yaw<-Math.PI)ty+=Math.PI*2;
  flyAnim={t0:performance.now(),dur:2600,e0:[cam.ex,cam.ey,cam.ez],e1:tgt,
           y0:cam.yaw,y1:ty,p0:cam.pitch,p1:Math.asin(Math.max(-1,Math.min(1,f[1])))};
}
const flySpeed=()=>Math.min(sceneR*0.5,Math.max(6,nearestD*0.35));
function clampEye(){
  const d=Math.hypot(cam.ex,cam.ey,cam.ez);
  if(d>sceneR*6){const k=sceneR*6/d;cam.ex*=k;cam.ey*=k;cam.ez*=k;}
}
function camBasis(){
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);

/* Face on to the run, so the fleet comes at you rather than past you.

   The hulls all travel +x, so standing anywhere off that axis turns the
   arrival into traffic crossing a junction; standing on it turns it into a
   fleet bearing down. a=0 puts the camera dead ahead of them. The small pitch
   is the one concession: the scatter is flattened in y, so a perfectly level
   view down the axis reads as a bright horizontal streak with no depth in it,
   and looking very slightly down gives the oncoming ranks somewhere to recede
   to. Everything else stays: the nose of the fleet is the end nearest you, so
   the first hulls out of the jump are the ones that arrive in your face, and
   the muster fills in behind them. */
function initCam(){
  const a=0,pp=0.14,d=sceneR*1.5;
  cam.ex=Math.cos(pp)*Math.cos(a)*d;cam.ey=Math.sin(pp)*d;cam.ez=Math.cos(pp)*Math.sin(a)*d;
  const f=V.norm([-cam.ex,-cam.ey,-cam.ez]);
  cam.yaw=Math.atan2(f[2],f[0]);cam.pitch=Math.asin(f[1]);
}
function mat(){
  const {f,s,u}=camBasis();
  const ex=cam.ex,ey=cam.ey,ez=cam.ez;
  const near=0.6,far=sceneR*12;
  const asp=cvs.width/cvs.height,t=Math.tan(0.42),
        A=(far+near)/(near-far),B=2*far*near/(near-far);
  const vm=[s[0],u[0],-f[0],0, s[1],u[1],-f[1],0, s[2],u[2],-f[2],0,
    -(s[0]*ex+s[1]*ey+s[2]*ez),-(u[0]*ex+u[1]*ey+u[2]*ez),(f[0]*ex+f[1]*ey+f[2]*ez),1];
  const pm=[1/(t*asp),0,0,0, 0,1/t,0,0, 0,0,A,-1, 0,0,B,0];
  const m=new Float32Array(16);
  for(let c=0;c<4;c++)for(let r2=0;r2<4;r2++){
    let s2=0;for(let k=0;k<4;k++)s2+=pm[k*4+r2]*vm[c*4+k];
    m[c*4+r2]=s2;}
  return {m,eye:[ex,ey,ez]};
}
function frustum(m){
  const P=[];
  for(let i=0;i<3;i++)for(const s of [1,-1]){
    const p=[m[3]+s*m[i],m[7]+s*m[4+i],m[11]+s*m[8+i],m[15]+s*m[12+i]];
    p.push(Math.hypot(p[0],p[1],p[2])||1);
    P.push(p);
  }
  return P;
}
const sphereIn=(P,x,y,z,r)=>{
  for(const p of P)if(p[0]*x+p[1]*y+p[2]*z+p[3]<-r*p[4])return false;
  return true;
};

let bgc=[0,0,0],inkc=[1,1,1];
function applyPal(){

let last=0,fpsA=60,triDrawn=0,idleT=0;
/* how far back down her own wake a ship starts. Nothing at all if the viewer
   asked for reduced motion — an arrival is the one thing here that moves on
   its own and cannot be waited out. */
const jumpLen=()=>reduced?0:sceneR*0.55;
/* the same hash the vertex shader takes, so a hull's flash opens exactly where
   she comes through rather than where an average ship would have */
const jumpFactor=ph=>0.55+0.90*((ph*7.3)%1);
/* a viewer who asked for reduced motion gets a fleet that has already arrived */
const jumpClock=()=>reduced?-1e6:jumpT0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.1,(now-last)/1000||0.016);last=now;
  fpsA+=(1/Math.max(dt,1e-4)-fpsA)*0.05;
  if(flyAnim){
    const u2=Math.min(1,(now-flyAnim.t0)/flyAnim.dur),e3=1-Math.pow(1-u2,3);
    cam.ex=flyAnim.e0[0]+(flyAnim.e1[0]-flyAnim.e0[0])*e3;
    cam.ey=flyAnim.e0[1]+(flyAnim.e1[1]-flyAnim.e0[1])*e3;
    cam.ez=flyAnim.e0[2]+(flyAnim.e1[2]-flyAnim.e0[2])*e3;
    cam.yaw=flyAnim.y0+(flyAnim.y1-flyAnim.y0)*e3;
    cam.pitch=flyAnim.p0+(flyAnim.p1-flyAnim.p0)*e3;
    if(u2>=1){flyAnim=null;if(sel!=null)orbFromCam();}
  }else if(sel!=null&&ships[sel]){
    if(!orb)orbFromCam();
    const sh=ships[sel];
    if(keys.size){
      const kd=dt*(keys.has("shift")?3:1);
      if(keys.has("a"))orb.yaw-=kd*1.4;
      if(keys.has("d"))orb.yaw+=kd*1.4;
      if(keys.has("q"))orb.pitch-=kd*1.1;
      if(keys.has("e"))orb.pitch+=kd*1.1;
      if(keys.has("w"))orb.dist*=Math.exp(-kd*1.3);
      if(keys.has("s"))orb.dist*=Math.exp(kd*1.3);
      orbClamp();
    }
    /* the same hash the shader takes off the schedule, or the camera tracks a
       bob the ship is not doing and the held hull drifts under the crosshair */
    const by=sh.y+(reduced?0:Math.sin(now/1000*0.55+(sh.phase*137.13%1)*6.2832)*0.45);
    const cp=Math.cos(orb.pitch),sp=Math.sin(orb.pitch);
    cam.ex=sh.x+orb.dist*cp*Math.cos(orb.yaw);
    cam.ey=by+orb.dist*sp;
    cam.ez=sh.z+orb.dist*cp*Math.sin(orb.yaw);
    const f=V.norm([sh.x-cam.ex,by-cam.ey,sh.z-cam.ez]);
    cam.yaw=Math.atan2(f[2],f[0]);
    cam.pitch=Math.asin(Math.max(-1,Math.min(1,f[1])));
  }else if(keys.size){
    const {f,s,u}=camBasis();
    const sp=flySpeed()*dt*(keys.has("shift")?4:1)*1.6;
    let mx=0,my=0,mz=0;
    if(keys.has("w")){mx+=f[0]*sp;my+=f[1]*sp;mz+=f[2]*sp;}
    if(keys.has("s")){mx-=f[0]*sp;my-=f[1]*sp;mz-=f[2]*sp;}
    if(keys.has("d")){mx+=s[0]*sp;my+=s[1]*sp;mz+=s[2]*sp;}
    if(keys.has("a")){mx-=s[0]*sp;my-=s[1]*sp;mz-=s[2]*sp;}
    if(keys.has("e"))my+=sp;
    if(keys.has("q"))my-=sp;

  }

     is also the one thing here that can strand the stage empty for good: a
     worker that dies, a job that never returns, and forged never reaches
     forgeTotal. So the muster is called anyway once the wait stops being
     plausible. Late hulls then pop in as they used to, which is a poor arrival
     but an arrival, and far better than a fleet nobody ever sees. */
  /* the last hull is down and nobody has taken the controls: go and stand
     next to the one that led them in */
  if(introArmed&&forged>=forgeTotal&&now/1000-forgeStart>1.5){
    introArmed=false;
    if(!drag&&!flyAnim&&sel==null&&!keys.size)flyToLead();
  }

  const {m,eye}=mat();
  gl.viewport(0,0,cvs.width,cvs.height);
  gl.clearColor(bgc[0],bgc[1],bgc[2],1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  gl.useProgram(starProg);
  gl.uniformMatrix4fv(USvp,false,m);
  gl.uniform3fv(USink,inkc);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.bindVertexArray(starVao);
  gl.drawArrays(gl.POINTS,0,starN);
  gl.depthMask(true);gl.disable(gl.BLEND);

  pickHi(eye,now);

  gl.useProgram(shipProg);
  gl.uniformMatrix4fv(UN.vp,false,m);
  gl.uniform1f(UN.t,now/1000);
  gl.uniform1f(UN.bob,reduced?0:0.45);
  gl.uniform1f(UN.jump,jumpLen());
  gl.uniform1f(UN.jt0,jumpClock());
  gl.uniform3fv(UN.eye,eye);
  gl.uniform3fv(UN.ink,inkc);
  gl.uniform3fv(UN.bg,bgc);
  gl.uniform1f(UN.fog,0.22/sceneR);
  triDrawn=0;
  const planes=frustum(m);
  const LODD=Math.max(700,chunkSize*2.2);
  for(const ch of chunks.values()){
    if(!ch.ids.length)continue;
    if(!sphereIn(planes,ch.cx,ch.cy,ch.cz,ch.rad))continue;
    const dx=eye[0]-ch.cx,dy=eye[1]-ch.cy,dz=eye[2]-ch.cz;
    const li=(dx*dx+dy*dy+dz*dz<LODD*LODD)?0:1;
    const l=ch.lod[li];
    if(!l.icount)continue;
    let skips=null;
    for(const id of ch.ids)
      if((activeHi.has(id)&&hiCache.has(id))||(luxShip&&luxShip.id===id))
        (skips=skips||[]).push(li?ships[id].rf:ships[id].rm);
    gl.bindVertexArray(l.vao);
    if(!skips){
      gl.drawElements(gl.TRIANGLES,l.icount,gl.UNSIGNED_INT,0);triDrawn+=l.icount/3;
    }else{
      skips.sort((a,b)=>a[0]-b[0]);
      let cur=0;
      for(const [st,cnt] of skips){
        if(st>cur){gl.drawElements(gl.TRIANGLES,st-cur,gl.UNSIGNED_INT,cur*4);triDrawn+=(st-cur)/3;}
        cur=st+cnt;
      }
      if(cur<l.icount){gl.drawElements(gl.TRIANGLES,l.icount-cur,gl.UNSIGNED_INT,cur*4);triDrawn+=(l.icount-cur)/3;}
    }
  }
  for(const id of activeHi){
    if(luxShip&&luxShip.id===id)continue;   /* dressed, and drawn below instead */
    const e=hiCache.get(id);if(!e)continue;
    gl.bindVertexArray(e.vao);
    gl.drawElements(gl.TRIANGLES,e.icount,gl.UNSIGNED_INT,0);
    triDrawn+=e.icount/3;
  }
  gl.bindVertexArray(null);

  /* the mouths they came through, over the top of everything and additive so
     they read as light rather than as more hull. No depth written: a flash is
     not a thing you can be behind. */
  if(flashN&&!reduced){
    gl.useProgram(flashProg);
    gl.uniformMatrix4fv(FL.vp,false,m);
    gl.uniform1f(FL.t,now/1000);
    gl.uniform1f(FL.jt0,jumpClock());
    gl.uniform3fv(FL.ink,inkc);
    gl.uniform1f(FL.size,sceneR*0.030*(cvs.height*0.5)/Math.tan(0.42));
    gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
    gl.depthMask(false);

    gl.drawArrays(gl.POINTS,0,flashN);
    gl.depthMask(true);gl.disable(gl.BLEND);

  /* the ship being held: hull, then paint, then her lit ports */
  if(luxShip&&ships[luxShip.id]){
    gl.useProgram(luxProg);
    gl.uniformMatrix4fv(LX.vp,false,m);
    gl.uniform1f(LX.t,now/1000);
    gl.uniform1f(LX.bob,reduced?0:0.45);
    gl.uniform1f(LX.jump,jumpLen());
    gl.uniform1f(LX.jt0,jumpClock());
    gl.uniform3fv(LX.eye,eye);
    gl.uniform3fv(LX.ink,inkc);
    gl.uniform3fv(LX.bg,bgc);
    gl.uniform1f(LX.fog,0.22/sceneR);
    for(const g of luxShip.groups){
      gl.uniform1f(LX.emis,g.emis);

}

let sel=null,orb=null;
/* selecting a ship locks the camera to her: drag orbits, wheel closes in */
function orbFromCam(){
  const sh=ships[sel];if(!sh)return;
  const dx=cam.ex-sh.x,dy=cam.ey-sh.y,dz=cam.ez-sh.z;
  const d=Math.max(1,Math.hypot(dx,dy,dz));
  orb={dist:d,yaw:Math.atan2(dz,dx),
       pitch:Math.asin(Math.max(-1,Math.min(1,dy/d)))};
}
function orbClamp(){
  const sh=ships[sel];
  orb.pitch=Math.max(-1.35,Math.min(1.35,orb.pitch));
  orb.dist=Math.max(Math.max(6,sh.slen*0.75),Math.min(sceneR*3,orb.dist));

function pickShip(px,py){
  const rect=cvs.getBoundingClientRect();
  const nx=(px-rect.left)/rect.width*2-1, ny=1-(py-rect.top)/rect.height*2;
  const t=Math.tan(0.42),asp=cvs.width/cvs.height;
  const {f,s:sv,u}=camBasis();
  const dir=V.norm([f[0]+sv[0]*nx*t*asp+u[0]*ny*t,
                    f[1]+sv[1]*nx*t*asp+u[1]*ny*t,
                    f[2]+sv[2]*nx*t*asp+u[2]*ny*t]);
  const o=[cam.ex,cam.ey,cam.ez];
  /* pass 1 — exact: the ray against each hull's own ellipsoid, oriented to
     her yaw and sized to her real length, beam and height. A long thin ship
     no longer owns a ball of empty space the size of her length, so the ship
     you can SEE under the cursor is the ship you get. Nearest hit wins. */
  let best=null,bt=1e18;
  for(let i=0;i<ships.length;i++){
    const sh=ships[i];
    const rs=Math.max(8,sh.slen*0.62);
    const ox=sh.x-o[0],oy=sh.y-o[1],oz=sh.z-o[2];
    const tc=ox*dir[0]+oy*dir[1]+oz*dir[2];
    if(tc<-rs)continue;
    if(ox*ox+oy*oy+oz*oz-tc*tc>rs*rs)continue;
    const m2=sh.meta;
    const ax=Math.max(3,m2.length*sh.sc*0.52),
          ay=Math.max(2.5,m2.height*sh.sc*0.56),
          az=Math.max(2.5,m2.beam*sh.sc*0.56);
    const cy2=Math.cos(sh.yaw),sy2=Math.sin(sh.yaw);
    const wx=o[0]-sh.x,wy=o[1]-sh.y,wz=o[2]-sh.z;
    const lox=( cy2*wx+sy2*wz)/ax, loy=wy/ay, loz=(-sy2*wx+cy2*wz)/az;
    const ldx=( cy2*dir[0]+sy2*dir[2])/ax, ldy=dir[1]/ay,
          ldz=(-sy2*dir[0]+cy2*dir[2])/az;
    const A=ldx*ldx+ldy*ldy+ldz*ldz,
          Bq=2*(lox*ldx+loy*ldy+loz*ldz),
          C=lox*lox+loy*loy+loz*loz-1;
    const disc=Bq*Bq-4*A*C;
    if(disc<0)continue;
    let tl=(-Bq-Math.sqrt(disc))/(2*A);
    if(tl<0)tl=(-Bq+Math.sqrt(disc))/(2*A);
    if(tl<0)continue;
    if(tl<bt){bt=tl;best=i;}
  }
  if(best!=null)return best;
  /* pass 2 — forgiving: nothing exactly under the cursor, so take a distant
     ship whose few pixels sit within a small screen radius of the click */
  const {m}=mat();
  const cx0=px-rect.left, cy0=py-rect.top;
  let bp=null,bd=1e9;
  for(let i=0;i<ships.length;i++){
    const sh=ships[i];
    const cw= m[3]*sh.x+m[7]*sh.y+m[11]*sh.z+m[15];
    if(cw<=0)continue;
    const cxp=(m[0]*sh.x+m[4]*sh.y+m[8]*sh.z+m[12])/cw,
          cyp=(m[1]*sh.x+m[5]*sh.y+m[9]*sh.z+m[13])/cw;
    const sx=(cxp+1)/2*rect.width, sy=(1-cyp)/2*rect.height;
    const d=Math.hypot(sx-cx0,sy-cy0);
    const appR=(sh.slen*0.5/cw)*(rect.height/2)/t;
    const tol=Math.max(12,appR+8);
    if(d<tol&&d<bd){bd=d;bp=i;}
  }
  return bp;
}

     +cg()+", and — the report is specific — CONSIDERABLE IMPROVISATION."],
   [()=>pk(["There is a cat aboard. There has always been a cat aboard.","The manifest does not mention the cat. The manifest has never mentioned the cat.","A cat holds an unofficial billet aboard, as one always has."])+" Fleet records do not explain how the same cat has now served "
     +ri(19,44)+" years."],
   [()=>"Somewhere between "+yd()+" and her third refit she gained a corridor that appears on no drawing. The crew stores the holiday decorations in it."],
   /* --- the minds --- */
   [()=>pk(["There is technically a crew.","A crew exists, in the sense that the paperwork requires one.","The crew is real, technically."])+" The ship's mind, "+ai+", files their rosters, cooks, navigates, and in "
     +ri(6,25)+" years has asked for nothing but a better telescope. The license requires one human aboard. The human is mostly furniture.",1],
   [()=>pk(["She flies herself.","No hands touch her helm.","She needs no one at the helm and has said so."])+" The mind aboard, "+ai+", accepted a crew once, rated the experience ACCEPTABLE, and has since preferred cargo that doesn't talk.",1],
   [()=>"The registry lists her master as "+ai+", which the records office assumed was a person. The records office has since met "
     +ai+", and several forms have been updated.",1],
   [()=>"Her mind, "+ai+", writes poetry into the burn logs. The auditors flagged it once. The auditors now hold a standing subscription.",1],
   /* --- the unexplained --- */
   [()=>"Ask about "+rg()+" and the mess goes quiet. The log for that season is sealed by an authority nobody aboard can name, and her "
     +pt()+" is newer than the rest of her by exactly that many years."],
   [()=>"She came back from "+rg()+" with "+ri(2,5)+" fewer crew and "+ri(2,5)
     +" more passengers than she left with. Both manifests are signed, stamped, and impossible."],
   [()=>"Every chronometer aboard runs "+ri(3,14)+" seconds ahead, and no adjustment holds past "+rg()
     +". The fleet stopped issuing corrections and started issuing her crews a second watch."],
   [()=>"Deep scans of her "+pt()+" show a weld pattern no known yard uses. Her build records are complete, continuous, and do not explain it."],
   /* --- the paperwork --- */
   [()=>pk(["She is a lease unit.","She has spent her whole life leased.","Ownership has only ever rented her."])+" The operator's logos have been painted over "+ri(3,9)
     +" times, each owner less solvent than the last, and through all of it she has never missed a scheduled burn. The paperwork is the only part of her that has ever failed."],
   [()=>"She has been collateral in "+ri(2,6)+" bankruptcies without missing a run. Three holding companies exist, as far as anyone can tell, solely to own her."],
   [()=>"Her naming rights were sold "+ri(2,5)+" times before the fleet gave up. The crew paints the old name back on at every refit, and the fleet has learned not to look."],
   [()=>"A tribunal at "+yd()+" has spent "+ri(4,15)
     +" years deciding which registry she belongs to. She flies both flags and pays neither's fees, which may be why nobody hurries."],
   /* --- the old --- */
   [()=>pk(["She is older than the port that services her.","She predates the port that services her.","The port that services her was built, originally, to service her."])+" Her "+pk(["original drawings","first bell","launch pennant","first captain's chair","quarter-scale builder's model"])
     +" sits in a museum at "+yd()+", her third crew's grandchildren stand her watches, and she still holds her line speed."],
   [()=>"Ships her age are supposed to be razor blades by now. She is the last hull of "+yd()
     +" still burning, and the apprentices are marched through her every year to see what a weld should look like."],
   [()=>"Her class was retired "+ri(9,30)+" years ago. The order is renewed annually, and annually goes unenforced — the officer who signs it learned to fly on her."],
   /* --- the new --- */
   [()=>"Commissioned "+ri(3,20)+" weeks ago at "+yd()
     +". The paint is still off-gassing, the couches still smell of packing foam, and her crew has strong opinions about the old fleet and not one scar to back them."],
   [()=>"She is so new her corridors still echo. Her shakedown cruise has been scheduled and rescheduled "+ri(3,7)
     +" times; her crew suspects the fleet is saving her for something worth a first time."],
   /* --- the unlucky --- */
   [()=>pk(["Three captains, two collisions, one small fire,","Four captains, one collision, two small fires,","Two captains, three collisions, one modest explosion,"])+" and a lightning strike in an atmosphere she had no business entering: the underwriters keep her file on its own shelf. Her current crew signed on anyway. Cheap berths."],
   [()=>pk(["Lightning, twice. A reef, once, in a system with no charted reefs.","Struck by lightning twice and once by a comet fragment the size of a regret.","Holed twice, grounded once, and struck by the only hailstorm ever recorded in vacuum."])+" Her crew has stopped asking WHAT NEXT and started keeping notes for the memoir."],
   [()=>"She has lost "+ri(3,9)+" anchors, "+ri(2,5)
     +" shuttles, and one entire paint scheme to circumstances her logs uniformly describe as UNFORESEEN. Nothing important has ever been lost. The unimportant things keep score."],
   /* --- the families --- */
   [()=>pk(["Crews rotate through the fleet on schedule; hers don't.","The fleet rotates crews every two years. Hers has not rotated in living memory.","Personnel calls her a scheduling anomaly. Her crew calls her home."])+" Transfers off her are refused, appealed, and quietly lost in the paperwork at "
     +yd()+". The fleet has given up asking what her galley does differently."],
   [()=>"Her mess fights are legendary and her reunions more so. "+ri(4,14)+" marriages, "+ri(2,7)
     +" feuds, and one standing bet all trace their origins to her middle deck."],
   [()=>pk(["Every hand aboard plays an instrument, by a tradition nobody enforces and nobody breaks.","Sign aboard her and you will learn an instrument; no one will ask, and no one will let you refuse.","Her crew is, incidentally and completely, an orchestra."])+" Departure from "
     +rg()+" is the only concert most of that region ever hears."],
   /* --- the suspect --- */
   [()=>pk(["Her registered cargo is agricultural equipment. It is always agricultural equipment.","She hauls agricultural equipment, per the manifest, exclusively, forever.","Whatever the run, the manifest reads AGRICULTURAL EQUIPMENT."])+" Customs at "+rg()
     +" has boarded her "+ri(4,19)+" times and found agricultural equipment, and her pilot's smile has never once wavered."],
   /* --- the returned --- */
   [()=>"She was written off at "+rg()+" — struck from the registry, sold for plate. The wreck crew that towed her in rebuilt her on their own time instead, and she flies under the pennant of the yard dog who refused to cut her."],
   [()=>"She was found adrift and empty at "+rg()
     +", boarded, and restarted with the galley kettle still warm. The fleet declared the mystery closed for morale reasons. Her crew keeps the kettle."]];
  const DETAILS=[
   "The galley serves the same stew before every hard burn; nobody remembers why, and nobody risks finding out.",
   "Her hull rings in B-flat when the temperature drops, and her engineers tune the spare plating to match.",
   "The crew paints a small bird behind the airlock for every year in service; they are running out of airlock.",
   "Boarding her, you step over a brass line in the deck that appears on no drawing. Everyone steps over it.",
   "Her running lights burn half a shade warmer than regulation. Inspections keep noting it. Nobody corrects it.",
   "There is a handprint in the paint of her "+pt()+", sealed under six coats, renewed at every refit.",
   "New crew get the full tour: engineering, the bridge, and the dent. The dent gets the most time.",
   "Her intercom chime is the first four notes of a song nobody aboard can name and everybody aboard can hum.",
   "The watch rotation includes a slot called DOG that predates every current crew member. It is always filled.",
   "She smells faintly of cedar. She carries no cedar. The smell has tenure.",
   "Her coffee is famously terrible and defended to the knife.",
   "One porthole is always fogged and one is never fogged, and the two have traded places twice.",
   "The spare-parts locker holds a part no manifest lists and no system needs. It is dusted weekly.",
   "Somebody long ago scratched WORTH IT under the pilot's console, and every pilot since has read it on the bad days.",
   "Her escape pods have never been used; the crew waxes them anyway, the way you keep a promise.",
   "Her hails always seem to arrive half a second before you expect them. Signal lag has been ruled out.",
   "The junior-most hand aboard keeps the key to the good biscuits. This is constitutional law.",
   "Visiting inspectors get their tea in the one unmatched cup. Pass the inspection and the matched one comes out next time.",
   "Her drydock reservations are booked under a false name. The yards know. The tradition is older than the reason.",
   "Somewhere aboard is a betting book on her next posting that has never once been right and never once been closed."];
  const arcI=(R()*ARCS.length)|0;
  const aiShip=!!ARCS[arcI][1];
  let story=ARCS[arcI][0]();
  if(sh.hulls)story+=" "+pk([
   "She was assembled hull by hull over "+ri(4,11)+" years in open anchorage, and her "
     +sh.hulls+" hulls have never all been pressurized at once.",
   "Her "+sh.hulls+" hulls were berthed one a season across "+ri(4,11)
     +" years, and the oldest and the newest have never exchanged crews.",
   "It takes a full day to walk her end to end through all "+sh.hulls
     +" hulls. The junior watch does it weekly, because tradition weighs more than fuel."]);
  const dRoll=R();
  if(dRoll<0.62){
    const det=pk(DETAILS);
    if(R()<0.25)story=det+" "+story;else story+=" "+det;
  }
  if(R()<0.45)story+=" "+pk([
   "These days: "+pk(DUTIES)+" in "+rg()+".",
   "Current orders: "+pk(DUTIES)+" along "+rg()+", which she treats as a personal favor to the fleet.",
   "For now the fleet wastes her on "+pk(DUTIES)+", and she does it perfectly.",
   "Her present posting is "+pk(DUTIES)+" in "+rg()+"; everyone aboard calls it temporary. It has been "+ri(2,9)+" years.",
   "She is due at "+rg()+" on the ninth, and she will be there on the ninth.",
   "Next stop: "+rg()+", weather and paperwork permitting. Only one of those has ever stopped her.",
   "The board keeps trying to rotate her onto "+pk(DUTIES)+". Her captain keeps losing the paperwork."]);
  const QUIRKS=["keeps the old paper charts in a drawer and trusts them first",
   "has never lost a hand of cards or a ship",
   "talks to the mains like they answer",
   "signed on at sixteen and never went home",
   "is the third of that name to hold this chair",
   "keeps the ship a half-degree warm because the crew votes for it",
   "reads the whole watch rotation aloud every morning, all names, every time",
   "retired twice and un-retired twice",
   "collects harbor charts of ports she has no reason to visit and every intention of visiting",
   "delegates everything except the last walk-through before a burn",
   "learned the trade on a ship this ship once towed home",
   "keeps a pre-flight ritual so old that half its checklist items no longer exist",
   "answers to the ship's name off-duty and has stopped correcting people",
   "has a standing agreement with the cook that neither will ever say the word RATIONS"];
  const rank=sh.slen>=180?"COMMODORE":sh.slen>=80?"CAPTAIN":sh.slen>=35?"COMMANDER"
            :pk(["LIEUTENANT","FLIGHT OFFICER"]);
  const crew=[];
  if(aiShip){
    crew.push(["SHIP'S MIND",ai]);
    crew.push(["CARETAKER",nm()]);
    if(comp>40)crew.push(["AUDITOR",nm()]);
  }else{
    const co=rank+" "+nm();
    if(comp<=2){
      crew.push(["PILOT",co]);
      if(comp>1)crew.push([pk(["SYSTEMS","GUNNER","NAVIGATOR"]),nm()]);
    }else if(comp<=12){
      crew.push(["CO",co],[pk(["ENGINEER","MEDIC","BOSUN"]),nm()],[pk(["NAVIGATOR","COMMS","PURSER"]),nm()]);
    }else{
      crew.push(["CO",co],["XO","LT CMDR "+nm()],[pk(["CHIEF ENG","REACTOR CHIEF"]),nm()],
                [pk(["FLIGHT BOSS","QUARTERMASTER","MASTER-AT-ARMS"]),nm()]);
    }
    if(R()<0.35)story+=" Her "+(comp<=2?"pilot":"captain")+" "+pk(QUIRKS)+".";
  }
  return {story,crew,comp};
}
function cardHTML(id){
  const sh=ships[id],m=sh.meta,L=lore(id);
  const dims=Math.round(m.length*sh.sc)+" &times; "+Math.round(m.beam*sh.sc)+
    " &times; "+Math.round(m.height*sh.sc)+" m";
  const mass=Math.round(m.mass*sh.sc*sh.sc*sh.sc).toLocaleString();
  return `<div id="cardX">&times;</div>
    <div class="d">${m.desig}</div>
    <div class="k">${m.klass}${sh.hulls?" &middot; "+sh.hulls+" HULLS":""}</div>
    <div class="k">${dims} &middot; ${mass} t &middot; complement ${L.comp.toLocaleString()}</div>
    <div class="story">${L.story}</div>
    ${L.crew.map(c=>`<div class="cr"><span class="role">${c[0]}</span>${c[1]}</div>`).join("")}`;
}
function select(id){
  const card=document.getElementById("card");
  if(id==null||!ships[id]){sel=null;orb=null;card.classList.remove("on");luxFree();return;}
  /* Re-selecting the ship already held must not fly the camera anywhere. It
     used to fall through to the approach below, which recomputes a stand-off
     of slen*2.3 and flies out to it — so a click meant for a neighbour that
     landed back on this hull threw away however far the wheel had closed in,
     and read as the camera jumping for no reason. Hold what is held. */
  if(id===sel&&orb){card.classList.add("on");return;}
  sel=id;
  luxRequest(id);
  card.innerHTML=cardHTML(id);
  card.classList.add("on");
  document.getElementById("cardX").onclick=()=>select(null);
  const sh=ships[id];
  let d=[cam.ex-sh.x,cam.ey-sh.y,cam.ez-sh.z];
  let Ld=V.len(d);
  if(Ld<1e-3){d=[1,0.25,0.3];Ld=V.len(d);}
  const dist=Math.max(sh.slen*2.3,18);
  const tgt=[sh.x+d[0]/Ld*dist,sh.y+d[1]/Ld*dist+sh.slen*0.22,sh.z+d[2]/Ld*dist];
  const f=V.norm([sh.x-tgt[0],sh.y-tgt[1],sh.z-tgt[2]]);
  let ty=Math.atan2(f[2],f[0]);
  const tp=Math.asin(Math.max(-1,Math.min(1,f[1])));
  while(ty-cam.yaw>Math.PI)ty-=Math.PI*2;
  while(ty-cam.yaw<-Math.PI)ty+=Math.PI*2;
  orb=null;
  if(reduced){cam.ex=tgt[0];cam.ey=tgt[1];cam.ez=tgt[2];cam.yaw=ty;cam.pitch=tp;orbFromCam();}
  else flyAnim={t0:performance.now(),dur:850,e0:[cam.ex,cam.ey,cam.ez],e1:tgt,
                y0:cam.yaw,y1:ty,p0:cam.pitch,p1:tp};
}

/* ===================== io ===================== */
function resize(){
  cvs.width=Math.round(innerWidth*dpr);
  cvs.height=Math.round(innerHeight*dpr);
}
addEventListener("resize",()=>{dpr=Math.min(devicePixelRatio||1,2);resize();});
let drag=null;
cvs.addEventListener("pointerdown",e=>{
  cvs.setPointerCapture(e.pointerId);cvs.classList.add("dragging");
  drag={x:e.clientX,y:e.clientY,pan:e.shiftKey||e.button===2,moved:0,t:performance.now()};});
cvs.addEventListener("pointermove",e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  drag.moved+=Math.abs(dx)+Math.abs(dy);
  if(drag.moved>8){flyAnim=null;introArmed=false;}
  if(sel!=null&&ships[sel]){
    if(!orb)orbFromCam();
    orb.yaw+=dx*0.005;
    orb.pitch+=dy*0.005;
    orbClamp();
  }else if(drag.pan){
    const {s,u}=camBasis(),k=flySpeed()*0.004;
    cam.ex+=(-s[0]*dx+u[0]*dy)*k;
    cam.ey+=(-s[1]*dx+u[1]*dy)*k;
    cam.ez+=(-s[2]*dx+u[2]*dy)*k;
    clampEye();
  }else{
    cam.yaw+=dx*0.0036;
    cam.pitch=Math.max(-1.5,Math.min(1.5,cam.pitch-dy*0.0036));
  }});
const endDrag=e=>{
  if(drag&&drag.moved<=8&&e.type==="pointerup"&&performance.now()-drag.t<600&&!drag.pan)
    select(pickShip(e.clientX,e.clientY));
  drag=null;cvs.classList.remove("dragging");};
cvs.addEventListener("pointerup",endDrag);cvs.addEventListener("pointercancel",endDrag);
cvs.addEventListener("contextmenu",e=>e.preventDefault());
cvs.addEventListener("webglcontextlost",e=>{
  e.preventDefault();
  document.getElementById("stat").textContent=
    "GPU CONTEXT LOST — reload the page (try a smaller fleet if it recurs)";});
cvs.addEventListener("wheel",e=>{
  e.preventDefault();flyAnim=null;introArmed=false;
  if(sel!=null&&ships[sel]){
    if(!orb)orbFromCam();
    orb.dist*=Math.exp(e.deltaY*0.0012);
    orbClamp();
  }else{
    const {f}=camBasis(),k=-e.deltaY*0.0032*flySpeed();
    cam.ex+=f[0]*k;cam.ey+=f[1]*k;cam.ez+=f[2]*k;clampEye();
  }},{passive:false});
let pinch=0;
cvs.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                       e.touches[0].clientY-e.touches[1].clientY);
    if(pinch){flyAnim=null;
      if(sel!=null&&ships[sel]){
        if(!orb)orbFromCam();
        orb.dist*=Math.exp((pinch-d)*0.005);orbClamp();
      }else{
        const {f}=camBasis(),k=(d-pinch)*flySpeed()*0.012;
        cam.ex+=f[0]*k;cam.ey+=f[1]*k;cam.ez+=f[2]*k;clampEye();}}
    pinch=d;e.preventDefault();
  }},{passive:false});
cvs.addEventListener("touchend",()=>pinch=0);
const keys=new Set();
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
addEventListener("blur",()=>keys.clear());

function toast(s){
  const t=document.getElementById("toast");
  t.textContent=s;t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),900);
}
document.querySelectorAll("#bar button[data-n]").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("#bar button[data-n]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    targetN=+b.dataset.n;toast("FORGING FLEET");startFleet(false);
  });});
document.getElementById("bNew").addEventListener("click",()=>{toast("FORGING FLEET");startFleet(true);});
document.getElementById("bPal").addEventListener("click",()=>{palI=(palI+1)%PAL.length;applyPal();});
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if("wasdqe".includes(k)&&k.length===1){keys.add(k);flyAnim=null;introArmed=false;return;}
  if(e.key==="Shift")keys.add("shift");
  if(e.key==="Escape")select(null);
  if(k==="n"){toast("FORGING FLEET");startFleet(true);}
  if(k==="p"){palI=(palI+1)%PAL.length;applyPal();}
});
document.getElementById("roster").addEventListener("click",e=>{
  const el=e.target.closest("[data-id]");
  if(el)select(+el.dataset.id);
});

/* ===================== go ===================== */
applyPal();
resize();
startFleet(false);
initCam();
requestAnimationFrame(t=>{last=t;idleT=t;frame(t);});
</script>
</body>
